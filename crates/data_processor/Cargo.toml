[package]
name = "data_processor"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "data_processor"
crate-type = ["cdylib", "rlib"] # This is essential for Python bindings

[dependencies]
compute_core = { workspace = true }
bincode = { workspace = true}
half = { workspace = true}
image = { workspace = true}
tracing = { workspace = true}
lz4_flex = { workspace = true }
reqwest = { workspace = true }
tiff = { workspace = true }
shapefile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
weezl = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
xz2 = "0.1"
[target.'cfg(not(all(target_os = "unknown", target_arch = "wasm32")))'.dependencies]
zstd = "0.13"
bytemuck = { workspace = true }
zarrs = { workspace = true }
zarrs_filesystem = { workspace = true }
zarrs_plugin = { workspace = true }
zarrs_data_type = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
ndarray = { workspace = true }
bytes = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pure-Rust zstd decoder, so blosc chunks can be read on wasm32 without a C toolchain.
ruzstd = "0.9"
web-sys = { workspace = true }

[dev-dependencies]
criterion = "0.7"
test-log = { workspace = true}
wiremock = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
pollster = { workspace = true }
