name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Independent jobs run in parallel, so the wall-clock time is that of the
# slowest job rather than the sum of all steps. Every job uploads its outputs
# as an `artifacts-*` artifact; release.yaml merges all of them and
# gh-pages-deploy.yaml takes `artifacts-wasm`.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Rust formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -q -- -D warnings

      - name: Python linting
        run: pipx run ruff check ./python_module

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/tint/package-lock.json

      # Tint is the WGSL compiler of Chrome and enforces rules naga does not,
      # so shaders that run natively and in Firefox can still fail in Chrome.
      - name: Validate shaders with Tint
        run: |
          cargo run -q -p compute_core --example dump_shaders -- target/browser_shaders
          npm ci --prefix .github/tint
          node .github/tint/check_shaders.mjs target/browser_shaders crates/render_core/src/shaders

      - name: Check frontend JS syntax
        run: |
          for f in main plot plotly_dark sources tile_utils utils viewer; do
            node --check "frontend/js/$f.js"
          done

  test:
    name: Rust tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WGPU_BACKEND: vulkan
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/software-gpu

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      # Tarpaulin runs the whole test suite, so the tests are not run a
      # second time without instrumentation; a failing test fails this step.
      - name: Tests with coverage
        run: |
          cargo tarpaulin \
            --engine llvm \
            --out html --out lcov --out xml \
            --output-dir coverage_report \
            --run-types Tests \
            --skip-clean \
            --timeout 600 \
            --fail-under 80 \
            -p compute_core -p data_processor -p simulation

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage-report
          path: coverage_report/
          if-no-files-found: ignore

  python:
    name: Python package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WGPU_BACKEND: vulkan
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/software-gpu

      - uses: Swatinem/rust-cache@v2

      # The extension is abi3, so one wheel serves every Python version. It is
      # built once and the tests run against exactly the wheel that is shipped.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install wheel and test dependencies
        run: pip install dist/*.whl pytest pandas pyarrow scipy matplotlib

      - name: Python tests
        run: pytest ./python_module/tests

      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-wheel-ubuntu-latest
          path: dist/*.whl
          retention-days: 3

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # wasm-pack downloads wasm-bindgen and wasm-opt from GitHub releases on
      # every run and gives up on the first failed request, which breaks the
      # build whenever GitHub's release downloads hiccup. Install pinned tools
      # ourselves (with retries, cached between runs) so wasm-pack finds them
      # on PATH and downloads nothing.
      - name: Resolve WASM tool versions
        id: wasm-tools
        run: |
          set -euo pipefail
          # wasm-bindgen-cli must match the wasm-bindgen crate exactly.
          wasm_bindgen=$(cargo metadata --format-version 1 --manifest-path crates/wasm_bindings/Cargo.toml \
            | jq -r '[.packages[] | select(.name == "wasm-bindgen") | .version] | first')
          echo "wasm-bindgen=$wasm_bindgen" >> "$GITHUB_OUTPUT"
          echo "wasm-pack=0.15.1" >> "$GITHUB_OUTPUT"
          echo "binaryen=130" >> "$GITHUB_OUTPUT"
          echo "dir=$HOME/.wasm-tools" >> "$GITHUB_OUTPUT"

      - name: Cache WASM tools
        id: wasm-tools-cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.wasm-tools.outputs.dir }}
          key: wasm-tools-${{ runner.os }}-pack${{ steps.wasm-tools.outputs.wasm-pack }}-bindgen${{ steps.wasm-tools.outputs.wasm-bindgen }}-binaryen${{ steps.wasm-tools.outputs.binaryen }}

      - name: Install wasm-pack, wasm-bindgen and wasm-opt
        if: steps.wasm-tools-cache.outputs.cache-hit != 'true'
        env:
          TOOLS: ${{ steps.wasm-tools.outputs.dir }}
          WASM_PACK: ${{ steps.wasm-tools.outputs.wasm-pack }}
          WASM_BINDGEN: ${{ steps.wasm-tools.outputs.wasm-bindgen }}
          BINARYEN: ${{ steps.wasm-tools.outputs.binaryen }}
        run: |
          set -euo pipefail
          mkdir -p "$TOOLS/bin"
          fetch() {
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/tool.tar.gz" "$1"
            tar xzf "$RUNNER_TEMP/tool.tar.gz" -C "$TOOLS"
          }

          # crates.io, not GitHub releases: the prebuilt wasm-pack asset is flaky.
          cargo install wasm-pack --version "$WASM_PACK" --locked --root "$TOOLS"

          if fetch "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN}/wasm-bindgen-${WASM_BINDGEN}-x86_64-unknown-linux-musl.tar.gz"; then
            mv "$TOOLS/wasm-bindgen-${WASM_BINDGEN}-x86_64-unknown-linux-musl"/{wasm-bindgen,wasm-bindgen-test-runner,wasm2es6js} "$TOOLS/bin/"
          else
            echo "::warning::prebuilt wasm-bindgen download failed, building it from source"
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked --root "$TOOLS"
          fi

          fetch "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN}/binaryen-version_${BINARYEN}-x86_64-linux.tar.gz"
          mv "$TOOLS/binaryen-version_${BINARYEN}/bin/wasm-opt" "$TOOLS/bin/"
          rm -rf "$TOOLS"/wasm-bindgen-*-musl "$TOOLS"/binaryen-version_*

      - name: Add WASM tools to PATH
        run: |
          echo "${{ steps.wasm-tools.outputs.dir }}/bin" >> "$GITHUB_PATH"
          "${{ steps.wasm-tools.outputs.dir }}/bin/wasm-pack" --version
          "${{ steps.wasm-tools.outputs.dir }}/bin/wasm-bindgen" --version
          "${{ steps.wasm-tools.outputs.dir }}/bin/wasm-opt" --version

      - name: Build WASM
        run: wasm-pack build crates/wasm_bindings --target web --release --out-dir wasm_dist

      - name: Test WASM bindings (Node)
        working-directory: crates/wasm_bindings
        run: wasm-pack test --node

      - name: Stage WASM artifacts
        run: |
          mkdir -p staging/wasm
          cp crates/wasm_bindings/wasm_dist/*.wasm crates/wasm_bindings/wasm_dist/*.js staging/wasm/

      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-wasm
          path: staging/
          retention-days: 3

  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI binary
        run: cargo build -p cli --release

      - name: Stage CLI artifacts
        run: |
          mkdir -p staging
          cp target/release/cli staging/avalanchers-cli-ubuntu-latest
          cp settings.json README.md LICENSE NOTICE staging/

      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-cli-ubuntu-latest
          path: staging/
          retention-days: 3

  # macOS and Windows are only built for releases: tests, CLI binary and wheel.
  release-platforms:
    name: Release build on ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            backend: metal
            test-args: -p compute_core -p data_processor -p simulation
            cli: target/release/cli
          - os: windows-latest
            backend: dx12
            test-args: -p compute_core -p data_processor
            test-threads: --test-threads=1
            cli: target/release/cli.exe
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Rust tests
        run: cargo test ${{ matrix.test-args }} --release -- ${{ matrix.test-threads }}

      - name: Build CLI binary
        run: cargo build -p cli --release

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Python tests
        shell: bash
        run: |
          pip install dist/*.whl pytest pandas pyarrow scipy matplotlib
          pytest ./python_module/tests

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p staging
          ext="${{ runner.os == 'Windows' && '.exe' || '' }}"
          cp "${{ matrix.cli }}" "staging/avalanchers-cli-${{ matrix.os }}$ext"
          cp dist/*.whl staging/

      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-${{ matrix.os }}
          path: staging/
          retention-days: 3
