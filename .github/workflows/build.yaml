name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Build all 3 on release tags; only Ubuntu on standard push/PR
        os: >-
          ${{ startsWith(github.ref, 'refs/tags/v')
            && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]')
            || fromJSON('["ubuntu-latest"]')
          }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install Graphics Stack (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        env:
          # Force the use of the Software Rasterizer
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          # The hosted runner may contain a stale Google Chrome source. Chrome
          # is not required by this workflow, so remove it before refreshing
          # the package indexes.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -iname '*chrome*' -o -iname '*google*' \) -delete
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '/dl\.google\.com\/linux\/chrome/d' /etc/apt/sources.list
          fi
          sudo find /var/lib/apt/lists -maxdepth 1 -type f \
            \( -iname '*chrome*' -o -iname '*google*' \) -delete
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1-mesa-dev \
            libgl1-mesa-dri \
            libxcb-xfixes0-dev \
            mesa-vulkan-drivers \
            libvulkan-dev \
            vulkan-tools

      - name: Verify Software GPU
        if: matrix.os == 'ubuntu-latest'
        env:
          # Tell Vulkan to look in the standard ICD directory
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          # If the first path failed, let's find where it actually is:
          ls /usr/share/vulkan/icd.d/
          vulkaninfo --summary

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends llvm-dev libclang-dev python3-dev

      - name: Lint
        if: matrix.os == 'ubuntu-latest' 
        env:
            # This forces wgpu to use the software adapter
            WGPU_BACKEND: vulkan 
            VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          cargo fmt --check
          cargo clippy -q -- -D warnings

      - name: Build CLI Binary
        run: cargo build -p cli --release

      # Tint is the WGSL compiler of Chrome and enforces rules naga does not,
      # so shaders that run natively and in Firefox can still fail in Chrome.
      - name: Validate Shaders with Tint
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -q -p compute_core --release --example dump_shaders -- target/browser_shaders
          npm ci --prefix .github/tint
          node .github/tint/check_shaders.mjs target/browser_shaders crates/render_core/src/shaders

      - name: Test Linux
        if: matrix.os == 'ubuntu-latest'
        env:
            # This forces wgpu to use the software adapter
            WGPU_BACKEND: vulkan 
            VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run:
          cargo test -p compute_core -p data_processor -p simulation --release

      - name: Test MacOS
        if: matrix.os == 'macos-latest'
        env:
          WGPU_BACKEND: metal
        run:
          cargo test -p compute_core -p data_processor -p simulation --release

      - name: Test Windows
        if: matrix.os == 'windows-latest'
        env:
          # Force WGPU to use DX12 (Standard for Windows)
          WGPU_BACKEND: dx12
        run:
          cargo test -p compute_core -p data_processor --release -- --test-threads=1 
  
      # --- COVERAGE (Ubuntu Only) ---
      - name: Install Tarpaulin
        if: matrix.os == 'ubuntu-latest' 
        # && github.event_name == 'pull_request'
        # Using a binary install is much faster than 'cargo install'
        run: |
          curl -s https://api.github.com/repos/xd009642/tarpaulin/releases/latest \
          | grep "browser_download_url.*x86_64-unknown-linux-musl.tar.gz" \
          | cut -d : -f 2,3 \
          | tr -d \" \
          | wget -qi -
          tar -xzf cargo-tarpaulin-*.tar.gz
          mv cargo-tarpaulin ~/.cargo/bin/
          cargo tarpaulin --version

      - name: Coverage
        if: matrix.os == 'ubuntu-latest' 
        # && github.event_name == 'pull_request'
        env:
          # This forces wgpu to use the software adapter
          WGPU_BACKEND: vulkan 
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          SKIP_FOR_TARPAULIN: "true"
        run: |
          sudo apt-get install -y python3-dev
          cargo tarpaulin \
            --engine llvm \
            --out html --out lcov --out xml \
            --output-dir coverage_report \
            --run-types Tests \
            --verbose \
            --skip-clean \
            --timeout 600 \
            --fail-under 80 \
            -p compute_core -p data_processor -p simulation

        
      - name: Build and Install Python Package
        run: pip install .

      - name: Install pytest dependencies
        run: pip install pytest ruff pandas pyarrow scipy matplotlib

      - name: Python Linting
        run: ruff check ./python_module

      - name: Python Tests
        run: pytest ./python_module/tests

      # - name: Upload to codecov.io
      #   uses: codecov/codecov-action@v1.0.2
      #   with:
      #     token: ${{secrets.CODECOV_TOKEN}}

      - name: Upload Coverage Results
        if: matrix.os == 'ubuntu-latest' 
        # && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage-report
          path: coverage_report/


      - name: Prepare CLI Artifacts
        shell: bash
        run: |
          mkdir -p bin_dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/release/*.exe bin_dist/avalanchers-cli-${{ matrix.os }}.exe || true
          else
            # Find the binary (assuming it's named after your project) 
            # and rename it to include the OS for clarity in the release
            cp target/release/cli bin_dist/avalanchers-cli-${{ matrix.os }} || true
          fi

      - name: Build Python Wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter

      # wasm-pack downloads wasm-bindgen and wasm-opt from GitHub releases on
      # every run and gives up on the first failed request, which breaks the
      # build whenever GitHub's release downloads hiccup. Install pinned tools
      # ourselves (with retries, cached between runs) so wasm-pack finds them
      # on PATH and downloads nothing.
      - name: Resolve WASM tool versions
        id: wasm-tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          # wasm-bindgen-cli must match the wasm-bindgen crate exactly.
          wasm_bindgen=$(cargo metadata --format-version 1 --manifest-path crates/wasm_bindings/Cargo.toml \
            | jq -r '[.packages[] | select(.name == "wasm-bindgen") | .version] | first')
          echo "wasm-bindgen=$wasm_bindgen" >> "$GITHUB_OUTPUT"
          echo "wasm-pack=0.15.1" >> "$GITHUB_OUTPUT"
          echo "binaryen=130" >> "$GITHUB_OUTPUT"
          echo "dir=$HOME/.wasm-tools" >> "$GITHUB_OUTPUT"

      - name: Cache WASM tools
        id: wasm-tools-cache
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ${{ steps.wasm-tools.outputs.dir }}
          key: wasm-tools-${{ runner.os }}-pack${{ steps.wasm-tools.outputs.wasm-pack }}-bindgen${{ steps.wasm-tools.outputs.wasm-bindgen }}-binaryen${{ steps.wasm-tools.outputs.binaryen }}

      - name: Install wasm-pack, wasm-bindgen and wasm-opt
        if: matrix.os == 'ubuntu-latest' && steps.wasm-tools-cache.outputs.cache-hit != 'true'
        env:
          TOOLS: ${{ steps.wasm-tools.outputs.dir }}
          WASM_PACK: ${{ steps.wasm-tools.outputs.wasm-pack }}
          WASM_BINDGEN: ${{ steps.wasm-tools.outputs.wasm-bindgen }}
          BINARYEN: ${{ steps.wasm-tools.outputs.binaryen }}
        run: |
          set -euo pipefail
          mkdir -p "$TOOLS/bin"
          fetch() {
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/tool.tar.gz" "$1"
            tar xzf "$RUNNER_TEMP/tool.tar.gz" -C "$TOOLS"
          }

          # crates.io, not GitHub releases: the prebuilt wasm-pack asset is flaky.
          cargo install wasm-pack --version "$WASM_PACK" --locked --root "$TOOLS"

          if fetch "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN}/wasm-bindgen-${WASM_BINDGEN}-x86_64-unknown-linux-musl.tar.gz"; then
            mv "$TOOLS/wasm-bindgen-${WASM_BINDGEN}-x86_64-unknown-linux-musl"/{wasm-bindgen,wasm-bindgen-test-runner,wasm2es6js} "$TOOLS/bin/"
          else
            echo "::warning::prebuilt wasm-bindgen download failed, building it from source"
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked --root "$TOOLS"
          fi

          fetch "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN}/binaryen-version_${BINARYEN}-x86_64-linux.tar.gz"
          mv "$TOOLS/binaryen-version_${BINARYEN}/bin/wasm-opt" "$TOOLS/bin/"
          rm -rf "$TOOLS"/wasm-bindgen-*-musl "$TOOLS"/binaryen-version_*

      - name: Add WASM tools to PATH
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "${{ steps.wasm-tools.outputs.dir }}/bin" >> "$GITHUB_PATH"
          "${{ steps.wasm-tools.outputs.dir }}/bin/wasm-pack" --version
          "${{ steps.wasm-tools.outputs.dir }}/bin/wasm-bindgen" --version
          "${{ steps.wasm-tools.outputs.dir }}/bin/wasm-opt" --version

      - name: Build WASM (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        run: wasm-pack build crates/wasm_bindings --target web --release --out-dir wasm_dist

      - name: Test WASM Bindings (Node)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd crates/wasm_bindings
          wasm-pack test --node

      - name: Test frontend JS
        if: matrix.os == 'ubuntu-latest'
        run: |
          node --check frontend/js/main.js
          node --check frontend/js/plot.js
          node --check frontend/js/plotly_dark.js
          node --check frontend/js/sources.js
          node --check frontend/js/tile_utils.js
          node --check frontend/js/utils.js
          node --check frontend/js/viewer.js
        

      # --- UPLOAD ---
      - name: Prepare Artifacts for Upload
        shell: bash
        run: |
          mkdir -p staging_all
          mkdir -p staging_all/wasm
          cp -r dist/*.whl staging_all/ || true
          cp -r bin_dist/* staging_all/ || true
          cp -r crates/wasm_bindings/wasm_dist/*.wasm staging_all/wasm || true
          cp -r crates/wasm_bindings/wasm_dist/*.js staging_all/wasm || true
          cp -r settings.json staging_all/ || true
          cp -r README.md staging_all/ || true
          cp -r LICENSE staging_all/ || true
          cp -r NOTICE staging_all/ || true

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-${{ matrix.os }}
          path: staging_all/
          if-no-files-found: warn
          retention-days: 3
